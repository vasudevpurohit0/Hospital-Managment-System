# ============================================================
# ESIC Hospital Management System — Docker Compose
# ============================================================
# Development environment: starts all services with one command.
# Usage: docker compose up
# See docs/02-tech-stack.md §5 for the full local dev workflow.
# ============================================================

services:
  # --- PostgreSQL 15 ---
  # Primary data store for all application entities.
  # Data persists in a named volume across container restarts.
  postgres:
    image: postgres:15-alpine
    container_name: esic-hms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-esic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esic_password}
      POSTGRES_DB: ${POSTGRES_DB:-esic_hms}
    ports:
      # V-19/22: bound to loopback only -- api/web already reach this by
      # service name over the internal esic-network, so exposing it on every
      # host interface was never actually needed for local dev, only a
      # bigger attack surface. Still reachable at localhost:5433 for a host
      # tool (psql, a GUI client) the same as before.
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U esic_user -d esic_hms']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - esic-network

  # --- Redis 7 ---
  # Used for OPD queue token counters (atomic INCR),
  # BullMQ job queues (expiry scan, low-stock alerts),
  # and short-lived session/cache data.
  redis:
    image: redis:7-alpine
    container_name: esic-hms-redis
    restart: unless-stopped
    ports:
      # V-19/22: loopback-only, same reasoning as postgres above.
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: redis-server --appendonly yes
    networks:
      - esic-network

  # --- NestJS API ---
  # Backend application server.
  # Depends on postgres and redis being healthy before starting.
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: esic-hms-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-esic_user}:${POSTGRES_PASSWORD:-esic_password}@postgres:5432/${POSTGRES_DB:-esic_hms}
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-esic_user}:${POSTGRES_PASSWORD:-esic_password}@postgres:5432/${POSTGRES_DB:-esic_hms}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      API_PORT: 3000
      # V-03: the browser-facing origin CORS requests are allowed from --
      # matches the web service's host port mapping below, not its
      # in-network address.
      FRONTEND_URL: http://localhost:5173
      # Dev-only values, randomly generated for this compose file -- the app
      # now refuses to start if these are unset (see
      # apps/api/src/common/config/jwt-secrets.ts) rather than silently
      # falling back to a secret hardcoded in source, as it previously did.
      # Override with real secrets via a `docker-compose.override.yml` (or an
      # env_file) for anything beyond local development.
      JWT_ACCESS_SECRET: e2ac5bbe5fef93852791ffffedbfa6dde941d11f72b14ceddcb3ae28482226d0
      JWT_REFRESH_SECRET: f88136cb93b3d2af6f808f8d0c8e05a7e4503b4d71ffd892a356eabfb39242d9
      JWT_PLATFORM_SECRET: 35d5b5e9549f2985416b8a6108727aaddaf9526a3d293bcc9d1658941f0ba732
      # Dev-only: keeps the documented DoctorPass123!/AdminPass123!/etc. demo
      # logins working for every locally-onboarded hospital. Without this,
      # prisma/seed.ts generates and logs a fresh random password per tenant
      # per seed run instead (the production-safe default -- see V-17).
      SEED_USE_PREDICTABLE_PASSWORDS: 'true'
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/prisma:/app/prisma
      - ./apps/api/test:/app/test
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - esic-network

  # --- React Web App ---
  # Frontend development server with hot module replacement.
  # Proxies /api requests to the API container.
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: esic-hms-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
      # Vite's server-side proxy runs inside this container, so localhost
      # would point back to the web container rather than the NestJS API.
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/index.html:/app/index.html
      - /app/node_modules
    depends_on:
      - api
    networks:
      - esic-network

# --- Named volumes for data persistence ---
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# --- Network ---
networks:
  esic-network:
    driver: bridge
