<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Radial & Linear Gradients for Gold Seal Metallic Feel -->
    <radialGradient id="mpOuterGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </radialGradient>
    
    <radialGradient id="mpInnerBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>

    <linearGradient id="mpNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#134074"/>
    </linearGradient>

    <linearGradient id="mpSaffronGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <linearGradient id="mpGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#0A5C03"/>
    </linearGradient>

    <filter id="mpDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Filtered Group -->
  <g filter="url(#mpDropShadow)">
    <!-- Outer Decorative Stupa/Spoke Petal Ring (24 Petals of MP Seal) -->
    <g transform="translate(250,250)">
      <circle r="236" fill="url(#mpOuterGold)" stroke="#805B10" stroke-width="2"/>
      <circle r="226" fill="url(#mpNavyGrad)"/>
      
      <!-- 24 Stupa / Lotus Petals around edge -->
      <g id="petal">
        <path d="M 0,-236 C 12,-236 18,-222 0,-212 C -18,-222 -12,-236 0,-236 Z" fill="#D4AF37" stroke="#78500F" stroke-width="1"/>
      </g>
      <!-- Repeat petals radially -->
      <use href="#petal" transform="rotate(15)"/>
      <use href="#petal" transform="rotate(30)"/>
      <use href="#petal" transform="rotate(45)"/>
      <use href="#petal" transform="rotate(60)"/>
      <use href="#petal" transform="rotate(75)"/>
      <use href="#petal" transform="rotate(90)"/>
      <use href="#petal" transform="rotate(105)"/>
      <use href="#petal" transform="rotate(120)"/>
      <use href="#petal" transform="rotate(135)"/>
      <use href="#petal" transform="rotate(150)"/>
      <use href="#petal" transform="rotate(165)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(195)"/>
      <use href="#petal" transform="rotate(210)"/>
      <use href="#petal" transform="rotate(225)"/>
      <use href="#petal" transform="rotate(240)"/>
      <use href="#petal" transform="rotate(255)"/>
      <use href="#petal" transform="rotate(270)"/>
      <use href="#petal" transform="rotate(285)"/>
      <use href="#petal" transform="rotate(300)"/>
      <use href="#petal" transform="rotate(315)"/>
      <use href="#petal" transform="rotate(330)"/>
      <use href="#petal" transform="rotate(345)"/>
    </g>

    <!-- Outer Navy Ring for Circular Text -->
    <circle cx="250" cy="250" r="212" fill="none" stroke="#D4AF37" stroke-width="4"/>
    <circle cx="250" cy="250" r="162" fill="url(#mpOuterGold)" stroke="#805B10" stroke-width="3"/>

    <!-- Circular Text Paths -->
    <path id="textArcTop" d="M 60,250 A 190,190 0 1,1 440,250" fill="none"/>
    <path id="textArcBottom" d="M 440,250 A 190,190 0 0,1 60,250" fill="none"/>

    <!-- Text: Devanagari & English -->
    <text font-family="'Inter', 'Noto Sans Devanagari', 'Arial', sans-serif" font-weight="900" font-size="25" fill="#FFFFFF" letter-spacing="3" text-anchor="middle">
      <textPath href="#textArcTop" startOffset="50%">मध्य प्रदेश शासन</textPath>
    </text>

    <text font-family="'Inter', 'Arial', sans-serif" font-weight="800" font-size="17" fill="#FEE68A" letter-spacing="2" text-anchor="middle">
      <textPath href="#textArcBottom" startOffset="50%">GOVERNMENT OF MADHYA PRADESH</textPath>
    </text>

    <!-- Decorative Stars on Text Band -->
    <polygon points="76,250 80,240 84,250 94,250 86,256 89,266 80,260 71,266 74,256 66,250" fill="#FF9933"/>
    <polygon points="424,250 428,240 432,250 442,250 434,256 437,266 428,260 419,266 422,256 414,250" fill="#FF9933"/>

    <!-- Inner Central White Canvas -->
    <circle cx="250" cy="250" r="158" fill="url(#mpInnerBg)" stroke="#B45309" stroke-width="2"/>

    <!-- Banyan Tree Canopy Backdrop Motif (बरगद वृक्ष) -->
    <path d="M 125,230 C 125,140 170,110 250,110 C 330,110 375,140 375,230 C 375,280 340,300 250,300 C 160,300 125,280 125,230 Z" fill="#138808" opacity="0.15"/>
    
    <!-- Stylized Banyan Tree Canopy Outlines (Green & Gold Arch) -->
    <path d="M 150,220 Q 250,90 350,220" fill="none" stroke="#138808" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <path d="M 165,210 Q 250,105 335,210" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Ears of Wheat (गेहूं की बालियां) -->
    <g fill="#D4AF37" stroke="#78500F" stroke-width="0.8" transform="translate(130, 200) rotate(-15)">
      <ellipse cx="0" cy="0" rx="8" ry="16" transform="rotate(-30)"/>
      <ellipse cx="-6" cy="-22" rx="7" ry="15" transform="rotate(-25)"/>
      <ellipse cx="-10" cy="-44" rx="6" ry="14" transform="rotate(-20)"/>
      <ellipse cx="-12" cy="-66" rx="5" ry="12" transform="rotate(-15)"/>
      <!-- Wheat awns (lines) -->
      <path d="M 0,0 L -25,-35 M -6,-22 L -30,-55 M -10,-44 L -32,-75" stroke="#996515" stroke-width="1.5"/>
    </g>

    <!-- Right Ears of Paddy (धान की बालियां) -->
    <g fill="#D4AF37" stroke="#78500F" stroke-width="0.8" transform="translate(370, 200) rotate(15)">
      <ellipse cx="0" cy="0" rx="8" ry="16" transform="rotate(30)"/>
      <ellipse cx="6" cy="-22" rx="7" ry="15" transform="rotate(25)"/>
      <ellipse cx="10" cy="-44" rx="6" ry="14" transform="rotate(20)"/>
      <ellipse cx="12" cy="-66" rx="5" ry="12" transform="rotate(15)"/>
      <!-- Paddy awns -->
      <path d="M 0,0 L 25,-35 M 6,-22 L 30,-55 M 10,-44 L 32,-75" stroke="#996515" stroke-width="1.5"/>
    </g>

    <!-- Central Ashoka Lion Capital (India Emblem Pillar & Lions Motif) -->
    <g transform="translate(250,230) scale(0.72)" text-anchor="middle">
      <!-- Abacus Base -->
      <rect x="-65" y="70" width="130" height="20" rx="4" fill="#B45309" stroke="#78350F" stroke-width="2"/>
      <!-- Ashoka Chakra in Center Base -->
      <circle cx="0" cy="80" r="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="0" cy="80" r="2" fill="#FFFFFF"/>
      <path d="M 0,72 L 0,88 M -8,80 L 8,80 M -6,74 L 6,86 M -6,86 L 6,74" stroke="#FFFFFF" stroke-width="1"/>

      <!-- Bull & Horse silhouette on abacus sides -->
      <ellipse cx="-40" cy="80" rx="6" ry="4" fill="#FEE68A"/>
      <ellipse cx="40" cy="80" rx="6" ry="4" fill="#FEE68A"/>

      <!-- Three Lions (Central, Left, Right) Silhouette in Rich Gold & Navy Accent -->
      <!-- Center Lion -->
      <path d="M -25,70 C -35,30 -30,-20 0,-50 C 30,-20 35,30 25,70 Z" fill="url(#mpSaffronGrad)" stroke="#78350F" stroke-width="2"/>
      <path d="M 0,-40 C -15,-20 -20,10 -15,50" stroke="#FFF" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M 0,-40 C 15,-20 20,10 15,50" stroke="#FFF" stroke-width="2" fill="none" opacity="0.6"/>
      <!-- Lion Head Details -->
      <circle cx="0" cy="-35" r="18" fill="#FF9933" stroke="#78350F" stroke-width="2"/>
      <!-- Mane tufts -->
      <path d="M -16,-30 C -30,-10 -25,20 -18,40 M 16,-30 C 30,-10 25,20 18,40" stroke="#78350F" stroke-width="3" fill="none"/>
      <!-- Crown / Muzzle -->
      <ellipse cx="0" cy="-30" rx="6" ry="4" fill="#78350F"/>
      <!-- Eyes -->
      <circle cx="-6" cy="-38" r="2" fill="#78350F"/>
      <circle cx="6" cy="-38" r="2" fill="#78350F"/>

      <!-- Left Lion -->
      <path d="M -20,65 C -45,35 -55,-5 -35,-25 C -25,-15 -20,10 -15,65 Z" fill="#D4AF37" stroke="#78350F" stroke-width="1.5"/>
      <!-- Right Lion -->
      <path d="M 20,65 C 45,35 55,-5 35,-25 C 25,-15 20,10 15,65 Z" fill="#D4AF37" stroke="#78350F" stroke-width="1.5"/>

      <!-- Satyameva Jayate (सत्यमेव जयते) Ribbon -->
      <path d="M -75,100 L 75,100 L 65,122 L 0,118 L -65,122 Z" fill="#0B2545" stroke="#D4AF37" stroke-width="2"/>
      <text x="0" y="115" font-family="'Inter', 'Noto Sans Devanagari', sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" letter-spacing="1.5">
        सत्यमेव जयते
      </text>
    </g>

    <!-- Bottom Ribbon Badge: MP HEALTH SERVICES -->
    <g transform="translate(250, 360)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0B2545" stroke="#D4AF37" stroke-width="2"/>
      <text x="0" y="4" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#FF9933" text-anchor="middle" letter-spacing="1.5">
        MP HEALTH SERVICES
      </text>
    </g>
  </g>
</svg>
